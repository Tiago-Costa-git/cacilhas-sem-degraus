name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Atualizar dados do OpenStreetMap"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Teste de paridade Python vs JavaScript
        run: python testes/paridade.py
      - name: Montar o site
        run: |
          mkdir -p _site/data
          cp -r static/. _site/
          cp data/*.json _site/data/
          rm -f _site/config.js _site/data/reportes.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
